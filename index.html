
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            text-align: center;
            padding: 80px 20px;
        }

        h1 {
            color: #38bdf8;
        }

        p {
            color: #d1d5db;
            font-size: 18px;
        }

        button {
            background: #38bdf8;
            color: #111827;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1>Welcome to My Website!</h1>

    <p>I'm learning web development.</p>

    <button onclick="sayHello()">Click Me</button>

    <script>
        function sayHello() {
            alert("Thanks for visiting my website!");
        }
    </script>
</body>
</html>
